name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (for example 1.0.1)"
        required: true
        default: "1.0.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          sed -i "s/versionCode = [0-9]*/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Bo Phim ${{ inputs.version || github.ref_name }}
          tag_name: v${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
