name: VIETSTREAM MAX Audio Upgrade Build Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vietstream-max-audio-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile audio integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload build APK
        uses: actions/upload-artifact@v4
        with:
          name: VIETSTREAM-MAX-audio-upgrade-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
