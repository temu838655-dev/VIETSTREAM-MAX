name: VIETSTREAM MAX APK Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

concurrency:
  group: vietstream-max-build
  cancel-in-progress: false

jobs:
  build:
    name: Build VIETSTREAM MAX
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check build environment
        run: |
          java -version
          gradle --version

          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME is not configured."
            exit 1
          fi

          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK files
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/VIETSTREAM-MAX-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release/VIETSTREAM-MAX.apk
          ls -lh release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VIETSTREAM-MAX-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: VIETSTREAM MAX ${{ inputs.release_tag }}
          generate_release_notes: true
          files: release/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
