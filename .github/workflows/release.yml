
name: VIETSTREAM MAX APK Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build VIETSTREAM MAX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check environment
        run: |
          java -version
          gradle --version
          echo "Android SDK: $ANDROID_HOME"

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/VIETSTREAM-MAX-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release/VIETSTREAM-MAX.apk
          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIETSTREAM-MAX-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: VIETSTREAM MAX ${{ inputs.release_tag }}
          generate_release_notes: true
          files: release/*.apk
          fail_on_unmatched_files: true
